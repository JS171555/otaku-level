<!doctype html><html lang="pt-BR"><head><title>Entrar · OTAKU LEVEL</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="OTAKU LEVEL: suba de nível com cada anime que você acompanha.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15143a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Otaku Level">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head><body>
<main class="card"><header class="brand"><div class="brand-lockup"><img src="assets/pwa-icon-192.png" alt="" width="48" height="48"><h1>OTAKU LEVEL</h1></div><div class="xp" aria-hidden="true"><i></i></div></header>
<section id="v-login" aria-labelledby="t1"><h2 id="t1">Entrar</h2>
<form id="f-login" novalidate>
<label>E-mail<input name="email" type="email" autocomplete="email" required></label><small data-err="email" role="alert"></small>
<label>Senha<input name="password" type="password" autocomplete="current-password" required></label><small data-err="password" role="alert"></small>
<button class="btn" type="submit">Entrar</button></form>
<p class="links"><a href="#recuperar">Esqueci minha senha</a><a href="#cadastro">Criar conta</a></p></section>

<section id="v-cadastro" hidden aria-labelledby="t2"><h2 id="t2">Criar conta</h2>
<form id="f-cadastro" novalidate>
<label>Nome de usuário<input name="username" autocomplete="username" maxlength="20" required></label><small data-err="username" role="alert"></small>
<label>E-mail<input name="email" type="email" autocomplete="email" required></label><small data-err="email" role="alert"></small>
<label>Senha<input name="password" type="password" autocomplete="new-password" required></label><small data-err="password" role="alert"></small>
<label>Confirmar senha<input name="confirm" type="password" autocomplete="new-password" required></label><small data-err="confirm" role="alert"></small>
<button class="btn" type="submit">Criar conta</button></form>
<p class="links"><a href="#login">Já tenho conta</a></p></section>

<section id="v-recuperar" hidden aria-labelledby="t3"><h2 id="t3">Recuperar senha</h2>
<p class="mut">Enviaremos um link para você criar uma nova senha.</p>
<form id="f-recuperar" novalidate>
<label>E-mail<input name="email" type="email" autocomplete="email" required></label><small data-err="email" role="alert"></small>
<button class="btn" type="submit">Enviar link</button></form>
<p class="links"><a href="#login">Voltar para entrar</a></p></section>
</main><div id="toasts" aria-live="polite"></div>
<script type="module" src="js/pages/index.js"></script><script type="module" src="js/pwa.js"></script></body></html>
